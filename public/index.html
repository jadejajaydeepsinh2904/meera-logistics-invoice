<!doctype html>
<html lang="en" data-app-language="en">
<head>
  <script>
  (async()=>{
    const q=new URLSearchParams(location.search);
    if(['v665','v666','v667','v670','v690','v691','v692'].includes(q.get('reset'))){
      try{
        if('serviceWorker' in navigator){
          for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
        }
        for(const k of await caches.keys()) await caches.delete(k);
        localStorage.removeItem('ml_bootstrap_cache_v6');
        localStorage.removeItem('ml_app_settings_v44');
        sessionStorage.clear();
      }catch(e){}
      history.replaceState({},'',location.pathname);
      document.documentElement.innerHTML='<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>V69.2 Updated</title></head><body style="font-family:Arial;padding:32px"><h2>V69.2 cache reset complete</h2><p>Reloading Transport ERP…</p></body>';
      setTimeout(()=>location.replace('/'),700);
      return;
    }
  })();
  </script>

  <script>
  window.__mlBootErrors=[];
  addEventListener('error',event=>window.__mlBootErrors.push(event.message||'A required app file could not load.'));
  addEventListener('unhandledrejection',event=>window.__mlBootErrors.push(event.reason?.message||String(event.reason||'App startup failed.')));
  setTimeout(()=>{
    const root=document.getElementById('app');
    if(!root||root.childElementCount)return;
    const detail=window.__mlBootErrors.filter(Boolean).slice(-2).join(' · ');
    root.innerHTML=`<main style="min-height:100dvh;display:grid;place-items:center;padding:24px;background:#efeae0;color:#1b2a4a;font-family:Arial,sans-serif"><section style="width:min(520px,100%);background:#fbf9f4;border:1px solid #dbd2be;border-radius:16px;padding:22px;box-shadow:0 12px 35px #1b2a4a16"><h2 style="margin:0 0 10px">Transport ERP could not start</h2><p style="line-height:1.5;margin:0 0 12px">Android project is missing one or more web files. Open the V67.1 FULL PROJECT folder and run <b>npm run android:sync</b> again.</p>${detail?`<small style="display:block;color:#8b3a2e;word-break:break-word">${detail.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</small>`:''}</section></main>`;
  },6000);
  </script>
