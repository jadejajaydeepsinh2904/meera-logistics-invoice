<!doctype html>
<html lang="en">
<head>
  <script>
  (async()=>{
    const q=new URLSearchParams(location.search);
    if(q.get('reset')==='v59'){
      try{
        if('serviceWorker' in navigator){
          for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
        }
        for(const k of await caches.keys()) await caches.delete(k);
        localStorage.removeItem('ml_bootstrap_cache_v6');
        localStorage.removeItem('ml_app_settings_v44');
        sessionStorage.clear();
      }catch(e){}
      history.replaceState({},'',location.pathname);
      document.documentElement.innerHTML='<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>V53 Updated</title></head><body style="font-family:Arial;padding:32px"><h2>V54 cache reset complete</h2><p>Reloading Transport ERP…</p></body>';
      setTimeout(()=>location.replace('/'),700);
      return;
    }
  })();
  </script>
